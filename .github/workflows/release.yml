name: Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v3.1.0)'
        required: false
        default: 'v3.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure Keystore
        id: setup_keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release.keystore
          else
            echo "Generating release keystore..."
            keytool -genkeypair -v -keystore release.keystore -alias opentube -keyalg RSA -keysize 2048 -validity 10000 -storepass opentube123 -keypass opentube123 -dname "CN=OpenTube, OU=OpenTube, O=OpenTube, L=Unknown, S=Unknown, C=US"
            echo "STORE_PASSWORD=opentube123" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=opentube" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=opentube123" >> "$GITHUB_ENV"
          fi

      - name: Assemble Release APKs
        run: >
          ./gradlew :app:assembleGithubRelease :app:assembleFossRelease
          --build-cache --stacktrace
        env:
          STORE_PASSWORD: ${{ env.STORE_PASSWORD || secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ env.KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD || secrets.KEY_PASSWORD }}

      - name: Prepare Release Artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/github/release/app-github-universal-release.apk dist/opentube.apk
          cp app/build/outputs/apk/github/release/app-github-arm64-v8a-release.apk dist/opentube-arm64-v8a.apk
          cp app/build/outputs/apk/github/release/app-github-armeabi-v7a-release.apk dist/opentube-armeabi-v7a.apk
          cp app/build/outputs/apk/foss/release/app-foss-universal-release.apk dist/opentube-foss.apk
          cp app/build/outputs/apk/foss/release/app-foss-arm64-v8a-release.apk dist/opentube-foss-arm64-v8a.apk
          cp app/build/outputs/apk/foss/release/app-foss-armeabi-v7a-release.apk dist/opentube-foss-armeabi-v7a.apk
          cd dist
          sha256sum opentube*.apk > checksums.txt

      - name: Resolve Version Tag
        id: resolve_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "TAG_NAME=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure Release Notes
        env:
          TAG: ${{ steps.resolve_tag.outputs.TAG_NAME }}
        run: |
          if [ ! -s release-notes.md ]; then
            echo "# OpenTube ${TAG}" > release-notes.md
            echo "" >> release-notes.md
            echo "Release ${TAG} of OpenTube." >> release-notes.md
          fi

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.TAG_NAME }}
          name: OpenTube ${{ steps.resolve_tag.outputs.TAG_NAME }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/opentube.apk
            dist/opentube-arm64-v8a.apk
            dist/opentube-armeabi-v7a.apk
            dist/opentube-foss.apk
            dist/opentube-foss-arm64-v8a.apk
            dist/opentube-foss-armeabi-v7a.apk
            dist/checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
